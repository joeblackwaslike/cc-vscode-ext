name: E2E

# Drives a real VS Code instance, so it's heavier than the unit checks. Runs
# nightly + on demand (NOT every PR) so a flaky launch can't block a merge.
# Runs on free Linux runners under xvfb now that the launch helper
# (test/e2e/helpers/launch.ts) resolves VS Code cross-platform. Auth uses a
# long-lived subscription token (CLAUDE_CODE_OAUTH_TOKEN secret, generated with
# `claude setup-token`) so the model-dependent specs get real responses on the
# Max plan rather than metered API billing. Promote to a required check once
# proven stable.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC nightly

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: VS Code e2e (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Electron/VS Code shared libs + a virtual display. playwright install-deps
      # pulls the GUI libraries Electron also needs; xvfb backs the workbench.
      - name: Install VS Code system deps + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium
      # The bundled claude binary is darwin-arm64; on Linux the extension resolves
      # `claude` from PATH (see src/utils/platform.ts), so install it here.
      - name: Install claude CLI on PATH
        run: npm i -g @anthropic-ai/claude-code
      - run: npm run build
      # Primes the .vscode-test/ cache (downloads the linux build) the e2e
      # launcher reads from. Non-gating — the e2e run below is what matters.
      - name: Download VS Code into the test cache
        run: xvfb-run -a npm run test:integration || true
      - name: E2E
        run: xvfb-run -a npm run test:e2e
        env:
          CI: 'true'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
