name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# One in-flight run per ref; new pushes cancel the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:webview
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:webview

  # Integration tests drive a real VS Code extension host (single instance, no
  # CDP). They run on macOS because the launcher needs no xvfb there. Gates PRs
  # so a rename or activation regression (e.g. a stale extension id) is caught
  # immediately.
  integration:
    name: integration (VS Code host)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The `terminal.open` test resolves a claude binary. Until the
      # claude-cli-v<ver> release assets are published, the first-run download
      # 404s and the extension falls back to a `claude` on PATH — so install it,
      # pinned to the same version the extension targets (package.json).
      - name: Install claude CLI on PATH
        run: npm i -g "@anthropic-ai/claude-code@$(node -p "require('./package.json').claudeCliVersion")"
      - run: npm run test:integration
